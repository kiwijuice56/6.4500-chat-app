<section
    class="explore-tag-cloud"
    :class="{ 'explore-tag-cloud--disabled': disabled, 'explore-tag-cloud--collapsed': cloudCollapsed }"
    aria-label="Available tags"
>
    <div class="explore-tag-cloud-header">
        <p class="explore-tag-cloud-caption thread-card-note">Available tags</p>
        <button
            type="button"
            class="explore-tag-cloud-toggle"
            :class="{ 'explore-tag-cloud-toggle--collapsed': cloudCollapsed }"
            :disabled="disabled"
            :aria-expanded="!cloudCollapsed"
            :aria-label="cloudCollapsed ? 'Expand tag cloud' : 'Collapse tag cloud to one line'"
            @click="toggleCloudCollapsed"
        >
            <svg class="explore-tag-cloud-toggle-svg" viewBox="0 0 8 5" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M0 0 L4 5 L8 0z" />
            </svg>
        </button>
    </div>
    <div
        class="explore-tag-cloud-stage explore-tag-cloud-stage-grid"
        :class="{ 'explore-tag-cloud-stage-grid--collapsed': cloudCollapsed }"
    >
        <div class="explore-tag-cloud-expanded-layer" :aria-hidden="cloudCollapsed ? 'true' : 'false'">
            <Transition name="tag-cloud-disclaimer" mode="out-in">
                <div v-if="emptyPoolBanner" key="empty" class="explore-tag-cloud-disclaimer" role="status">{{ emptyPoolBanner }}</div>
                <div
                    v-else
                    key="cloud"
                    ref="viewportEl"
                    class="explore-tag-cloud-viewport"
                    @pointerdown="onViewportPointerDown"
                    @pointermove="onViewportPointerMove"
                    @pointerup="onViewportPointerUp"
                    @pointercancel="onViewportPointerCancel"
                    @wheel.prevent="onViewportWheel"
                >
                    <div ref="worldEl" class="explore-tag-cloud-world" :style="worldStyle">
                        <div class="explore-tag-cloud-grid-layer" aria-hidden="true"></div>
                        <div
                            v-if="showCollisionDebug && layoutItems.length"
                            class="explore-tag-cloud-collision-debug"
                            aria-hidden="true"
                        >
                            <div
                                v-for="item in layoutItems"
                                :key="'collision-' + item.key"
                                class="explore-tag-cloud-collision-debug-box"
                                :style="item.collisionBoxStyle"
                            ></div>
                        </div>
                        <div class="explore-tag-cloud-words">
                            <button
                                v-for="item in layoutItems"
                                :key="item.key"
                                type="button"
                                class="explore-tag-cloud-word"
                                :class="{ 'explore-tag-cloud-word--primary': item.isPrimary }"
                                :disabled="disabled"
                                :style="item.style"
                                @pointerenter="onWordPointerEnter"
                                @pointerleave="onWordPointerLeave"
                                @click.stop="$emit('pick', item.display)"
                            ><span class="explore-tag-cloud-word-inner">{{ item.label }}</span></button>
                        </div>
                    </div>
                </div>
            </Transition>
        </div>
        <div
            class="explore-tag-cloud-collapsed-layer"
            :aria-hidden="!cloudCollapsed ? 'true' : 'false'"
        >
            <div class="explore-tag-cloud-strip" role="list">
                <p
                    v-if="emptyPoolBanner"
                    class="explore-tag-cloud-strip-disclaimer"
                    role="status"
                >{{ emptyPoolBanner }}</p>
                <div v-else class="explore-tag-cloud-strip-scroll">
                    <button
                        v-for="item in stripItems"
                        :key="'strip-' + item.key"
                        type="button"
                        class="explore-tag-cloud-strip-chip"
                        :disabled="disabled"
                        @click="$emit('pick', item.display)"
                    >{{ item.label }}</button>
                </div>
            </div>
        </div>
    </div>
</section>
